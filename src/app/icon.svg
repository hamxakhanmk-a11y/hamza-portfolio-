<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#27b4dc"/>
      <stop offset="0.45" stop-color="#0879aa"/>
      <stop offset="1" stop-color="#063a5b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#fffaf2"/>
  <g fill="url(#water)">
    <!-- two raindrop stems: pointed at the top, round at the bottom -->
    <path d="M19 6 C22.5 15 25.5 21 25.5 41 A6.5 6.5 0 0 1 12.5 41 C12.5 21 15.5 15 19 6 Z"/>
    <path d="M45 9 C48.5 18 51.5 24 51.5 43 A6.5 6.5 0 0 1 38.5 43 C38.5 24 41.5 18 45 9 Z"/>
    <!-- the liquid crossbar, sagging a little between them -->
    <path d="M23 28.5 C30 26 34 32.5 41 29 L41 38.5 C34 42.5 30 35.5 23 39 Z"/>
  </g>
  <g fill="url(#glow)">
    <path d="M19 6 C22.5 15 25.5 21 25.5 41 A6.5 6.5 0 0 1 12.5 41 C12.5 21 15.5 15 19 6 Z"/>
    <path d="M45 9 C48.5 18 51.5 24 51.5 43 A6.5 6.5 0 0 1 38.5 43 C38.5 24 41.5 18 45 9 Z"/>
  </g>
  <!-- glossy highlights, like light catching water -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M16.2 22 C15.6 28 15.5 34 15.9 39" stroke-width="1.7" stroke-opacity="0.85"/>
    <path d="M42.2 25 C41.6 31 41.5 36 41.9 41" stroke-width="1.7" stroke-opacity="0.85"/>
    <path d="M26 31.2 C29 30.4 31 31.6 33 32.6" stroke-width="1.1" stroke-opacity="0.7"/>
  </g>
  <circle cx="16.4" cy="44.5" r="1.1" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="42.4" cy="46.5" r="1.1" fill="#ffffff" fill-opacity="0.8"/>
</svg>
